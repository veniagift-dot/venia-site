</div><script>
const clamp=x=>Math.min(Math.max(x,0),1);
const ease=t=>1-Math.pow(1-clamp(t),3);
const inout=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=clamp(t);const c=1.5;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
// rings
for(let i=0;i<14;i++){rings.appendChild(document.createElement('i'));holes.appendChild(document.createElement('i'))}
// hebrew numerals
const U=['','א','ב','ג','ד','ה','ו','ז','ח','ט'],T=['','י','כ','ל'];
function heb(n){let s;if(n===15)s='טו';else if(n===16)s='טז';else s=T[Math.floor(n/10)]+U[n%10];
 return s.length===1?s+'׳':s.slice(0,-1)+'״'+s.slice(-1)}
const months=['תשרי','חשון','כסלו','טבת','שבט','אדר','ניסן','אייר','סיון','תמוז','אב','אלול'];
const tasks=['ישיבת צוות 9:00','לסגור את ההזמנה הגדולה','נשארו עד מאוחר','לקוח חדש!','דוחות רבעון','יום עמוס','תיקון דחוף','פרויקט הוגש','פגישה עם ספק','עוד משמרת','השקה','ספירת מלאי'];
const days=[[4,17],[9,23],[6,20],[11,27],[3,18],[8,24],[5,19],[12,26],[7,21],[10,25],[2,14],[13,28]];
const P=[];let ti=0;
months.forEach((m,i)=>days[i].forEach(d=>P.push({m,d:heb(d),task:tasks[(ti++*5)%tasks.length]})));
// timing of regular flips
const N=P.length;let s=6.3;
P.forEach((p,k)=>{const u=k/(N-1);const iv=0.13+0.33*Math.pow(1-Math.sin(Math.PI*u),2);p.s=s;p.fd=Math.min(0.48,iv*1.7);s+=iv});
const SP=[{html:'<div class="big" style="font-size:230px;margin-top:95px">רגע<span class="dot">.</span></div><div class="big" id="stopL" style="font-size:200px;margin-top:25px">לעצור<span class="dot">.</span></div>',hold:2.6,fd:0.5},
 {html:'<div class="big" style="font-size:140px;font-weight:800;letter-spacing:-3px;margin-top:85px">ולהגיד</div><div class="big" style="font-size:300px;margin-top:6px;letter-spacing:-8px">תודה<span class="dot">.</span></div>',hold:99,fd:1}];
let last=P[N-1];let st=last.s+last.fd;
SP.forEach(p=>{p.s=st+p.hold;st=p.s+p.fd});
const ALL=P.concat(SP);
ALL.forEach((p,i)=>{const e=document.createElement('div');e.className='pg'+(p.html?' sp':'');e.style.zIndex=1000-2*i;
 e.innerHTML=p.html?'<div class="band"><span class="m">היום</span></div>'+p.html
  :'<div class="band"><span class="m">'+p.m+'</span><span class="y">תשפ״ז</span></div><div class="d">'+p.d+'</div><div class="ln"></div><div class="task">'+p.task+'</div>';
 stack.appendChild(e);p.el=e});
const shade=document.createElement('div');shade.id='shade';stack.appendChild(shade);
const FINAL=SP[1].s-SP[1].hold; // time the thank-you page is revealed
window.TOTAL=FINAL+31.4;
const $=id=>document.getElementById(id);
function up(e,t0,d,dist=40){const k=ease((T0-t0)/d);e.style.opacity=k;e.style.transform='translateY('+dist*(1-k)+'px)'}
let T0=0;
window.setT=function(t){T0=t;
 // intro
 const ci=ease((t-5.5)/0.6);cal.style.opacity=ci;
 const capIn=ease((t-0.5)/0.8),capOut=0;
 cap.style.opacity=1-capOut;{const mv=inout((t-4.3)/1.3);cap.style.transform='translateY('+(520*(1-mv)-20*capOut)+'px) scale('+(1.12-0.12*mv)+')';}{const a=ease((t-0.3)/0.7),b=ease((t-1.4)/0.8);cey.style.opacity=a;cey.style.transform='translateY('+(24*(1-a))+'px)';cmn.style.opacity=b;cmn.style.transform='translateY('+(30*(1-b))+'px)';}
 // flips
 let sh=0;
 ALL.forEach((p,i)=>{if(p===SP[1]){p.el.style.display='block';return}
  const q=(t-p.s)/p.fd;
  if(q<=0){p.el.style.display='block';p.el.style.transform='none';p.el.style.filter='none';p.el.style.opacity=1}
  else if(q>=1){p.el.style.display='none'}
  else{const k=inout(q);p.el.style.display='block';const reg=!p.html;const dir=(i%2?1:-1);p.el.style.transform=reg?'translateY('+(-520*k*k)+'px) rotateZ('+(dir*9*k*k)+'deg) rotateX('+(k*125)+'deg)':'rotateX('+(k*120)+'deg) translateZ(0)';p.el.style.opacity=reg?1-clamp((k-0.55)/0.45):1;p.el.style.filter='brightness('+(1-0.3*k)+')';sh=Math.max(sh,Math.sin(Math.PI*k)*0.22);shade.style.zIndex=999-2*i}
 });
 shade.style.opacity=sh;

 // keep shade above the next visible page only: place it just under flipping page
 // intro scale of calendar + end move
 const m=inout((t-(FINAL+1.6))/2.8);
 const pop=t<FINAL?0:Math.sin(Math.PI*clamp((t-FINAL)/0.5))*0.025;
 const LE=last.s+last.fd;
 const push=t<LE?0.075*inout((t-6.3)/(LE-6.3)):0.075*(1-ease((t-LE)/0.35))+0.04*inout((t-LE)/2.2)*(1-inout((t-FINAL)/0.9));
 const jolt=t>LE?Math.sin((t-LE)*28)*Math.exp(-(t-LE)*7)*6:0;
 cal.style.transform='translate('+(262*m)+'px,'+(-330*m+40*(1-ci)+jolt)+'px) scale('+((1-0.52*m)*(0.94+0.06*ci)+pop+push*(1-m))+')';
 const g=$('glow');const gk=ease((t-FINAL)/1.2);g.style.opacity=gk*(0.85+0.15*Math.sin((t-FINAL)*2.2));g.style.transform='translate('+(262*m)+'px,'+(-330*m)+'px) scale('+(0.7+0.3*gk-0.42*m)+')';
 // end texts
 const E=FINAL+3.0;
 const F=FINAL;up($('e1'),F+3.6,1.0,70);up($('e2'),F+9.3,1.0,70);
 const h=ease((t-(F+13.3))/0.8);$('hr1').style.transformOrigin='right';$('hr1').style.transform='scaleX('+h+')';
 up($('x2'),F+13.6,0.9,50);
 {const c=$('cta');const k=ease((t-(F+20.6))/0.7);const pl=t>F+21.5?0.025*Math.max(0,Math.sin((t-(F+21.5))*3.2)):0;c.style.opacity=k;c.style.transform='translateY('+(40*(1-k))+'px) scale('+(0.9+0.1*back((t-(F+20.6))/0.7)+pl)+')';}
 up($('c1'),F+24.3,0.6,24);up($('c2'),F+24.5,0.6,24);up($('c3'),F+24.7,0.6,24);
 const lg=$('logo');const lk=ease((t-(F+25.0))/0.9);lg.style.opacity=lk;lg.style.transform='scale('+(0.8+0.2*back((t-(F+25.0))/0.9))+')';
};
setT(0);
window.TIMES={flips:P.map(p=>p.s),LE:last.s+last.fd,sp:SP.map(p=>p.s),FINAL};

function fit(){const sc=Math.min(window.innerWidth/1080,1);const S=document.getElementById('S');S.style.transform='scale('+sc+')';const w=document.getElementById('wrap');w.style.width=1080*sc+'px';w.style.height=1920*sc+'px'}
document.fonts.ready.then(()=>{setT(TOTAL-0.05);const c=document.getElementById('cta');c.style.opacity=1;fit()});
setT(TOTAL-0.05);fit();window.addEventListener('resize',fit);
</script></body></html>
