<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#141d33">
<title>VENIA | דף הזמנה</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Frank+Ruhl+Libre:wght@500;700&display=swap">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#141d33;--muted:#5d6577;--line:rgba(20,29,51,.12);--navy:#141d33;--gold:#b08d4a;--gold-ink:#7d5f26;--gold-soft:#faf5ea}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo",Arial,sans-serif;font-size:15px;line-height:1.5}
.sheet{max-width:760px;margin:20px auto;background:var(--card);border-radius:18px;box-shadow:0 10px 40px rgba(20,29,51,.1);overflow:hidden}
.top{background:var(--navy);color:#fff;padding:22px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand .w{font-family:"Frank Ruhl Libre",Georgia,serif;letter-spacing:.42em;font-size:26px;color:#e6c98e;direction:ltr;display:block}
.brand small{color:#c9c1ae;font-size:12.5px;letter-spacing:.06em}
.top .meta{text-align:left;font-size:13px;color:#d7d2c6}.top .meta b{display:block;font-size:20px;color:#fff;font-weight:800;letter-spacing:.02em}
.body{padding:22px 26px 26px;display:flex;flex-direction:column;gap:20px}
h2{margin:0 0 8px;font-size:14px;color:var(--gold-ink);letter-spacing:.04em;font-weight:700}
.cust{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;background:var(--gold-soft);border:1px solid rgba(176,141,74,.3);border-radius:12px;padding:14px 16px}
.cust div{display:flex;flex-direction:column}.cust span{font-size:12px;color:var(--muted)}.cust b{font-weight:600;word-break:break-word}
.cust .wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse}
th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:8px 6px;border-bottom:2px solid var(--navy)}
td{padding:12px 6px;border-bottom:1px solid var(--line);vertical-align:top}
td.n{white-space:nowrap;text-align:left;font-variant-numeric:tabular-nums}th.n{text-align:left}
td b{display:block;font-size:15.5px}
td ul{margin:6px 0 0;padding:0 16px 0 0;color:var(--muted);font-size:13.5px}
.tot{margin-right:auto;width:min(320px,100%);display:flex;flex-direction:column;gap:6px}
.tot div{display:flex;justify-content:space-between}.tot .disc{color:#2f7d55}
.tot .grand{border-top:2px solid var(--navy);padding-top:8px;font-size:19px;font-weight:800}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.acts a,.acts button{flex:1 1 150px;text-align:center;border-radius:999px;padding:11px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer;border:1px solid var(--navy);background:#fff;color:var(--navy)}
.acts .pri{background:var(--navy);color:#fff}
.foot{font-size:12px;color:var(--muted);text-align:center}
#bad{max-width:520px;margin:60px auto;text-align:center;padding:0 16px}
@media (max-width:560px){.sheet{margin:0;border-radius:0}.top,.body{padding:18px 16px}.cust{grid-template-columns:1fr}th.q,td.q{display:none}}
@media print{body{background:#fff}.sheet{box-shadow:none;margin:0;max-width:none}.acts{display:none}.top{-webkit-print-color-adjust:exact;print-color-adjust:exact}.cust{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.label{display:none}
@media print{body.lbl .sheet{display:none!important}body.lbl .label{display:flex}}
.label{width:100%;min-height:138mm;margin:0;box-sizing:border-box;border:1.5px solid #141d33;border-radius:4mm;padding:5mm 6mm;flex-direction:column;gap:3mm;font-size:11.5pt;line-height:1.35;color:#141d33}
.label .lh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid #141d33;padding-bottom:3mm}
.label .lw{font-family:"Frank Ruhl Libre",Georgia,serif;letter-spacing:.35em;font-size:20pt;direction:ltr}
.label .lh small{display:block;font-size:9pt;color:#7d5f26;letter-spacing:.04em}
.label .lno{text-align:left;font-size:9pt}.label .lno b{display:block;font-size:17pt}
.label dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1.5mm 4mm}.label dt{color:#5d6577;font-size:10pt}.label dd{margin:0;font-weight:700}
.label .lbox{border-top:1px dashed #999;padding-top:3mm}.label .lbox b{display:block;margin-bottom:1mm}
.label ul{margin:0;padding:0 5mm 0 0;font-size:10.5pt}
.label .lq{margin-top:auto;text-align:center;font-size:14pt;font-weight:800;border:1.5px solid #141d33;border-radius:3mm;padding:1.5mm}
</style>
<style id="pg"></style>
</head>
<body>
<div class="sheet" id="page" hidden>
  <div class="top">
    <div class="brand"><span class="w">VENIA</span><small>וֶניה · מארזי הוקרה</small></div>
    <div class="meta">הזמנה מס׳<b id="oid"></b><span id="odate"></span></div>
  </div>
  <div class="body">
    <section><h2>פרטי הלקוח</h2><div class="cust" id="cust"></div></section>
    <section><h2>פירוט ההזמנה</h2>
      <table><thead><tr><th>מארז</th><th class="n q">מחיר ליחידה</th><th class="n">כמות</th><th class="n">סה״כ</th></tr></thead><tbody id="lines"></tbody></table>
    </section>
    <div class="tot" id="tot"></div>
    <div class="acts">
      <button type="button" class="pri" id="cp">העתקה לאפליקציה</button>
      <button type="button" id="prA4">הדפסה / שמירה כ־PDF</button>
      <button type="button" id="prLbl">מדבקה לחבילה (בלי מחירים)</button>
      <a id="wa" target="_blank" rel="noopener">וואטסאפ ללקוח</a>
      <a id="tel">חיוג ללקוח</a>
    </div>
    <p class="foot">VENIA · 054-853-5975 · Veniagift@gmail.com</p>
  </div>
</div>
<div class="label" id="label"></div>
<div id="bad" hidden><h1>הקישור לא תקין</h1><p>לא הצלחנו לקרוא את פרטי ההזמנה מהקישור. פרטי ההזמנה המלאים נמצאים גם בגוף המייל וב־Netlify.</p></div>
<script>
(function(){
  const $=s=>document.querySelector(s);
  const nis=n=>'₪'+Math.round(+n||0).toLocaleString('he-IL');
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  let D=null;
  try{let b=(location.hash.slice(1)||new URLSearchParams(location.search).get('d')||'').replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
    D=JSON.parse(decodeURIComponent(escape(atob(b))))}catch(e){D=null}
  if(!D||!D.i||!D.l){$('#bad').hidden=false;return}
  document.title='VENIA | הזמנה '+D.i+(D.b?' · '+D.b:'');
  $('#oid').textContent=D.i;$('#odate').textContent=D.dt||'';
  const row=(k,v,w)=>v?`<div${w?' class="wide"':''}><span>${k}</span><b>${esc(v)}</b></div>`:'';
  $('#cust').innerHTML=row('שם',D.n)+row('עסק לחשבונית',D.b)+row('טלפון',D.p)+row('מייל',D.e)+row('משלוח',D.dl)+row('הערות',D.nt,1);
  $('#lines').innerHTML=D.l.map(x=>`<tr><td><b>${esc(x[0])}</b><ul>${(x[3]||[]).map(d=>`<li>${esc(d)}</li>`).join('')}</ul></td><td class="n q">${nis(x[2])}</td><td class="n">${esc(x[1])}</td><td class="n">${nis(x[1]*x[2])}</td></tr>`).join('');
  $('#tot').innerHTML=`<div><span>סכום ביניים</span><span>${nis(D.s)}</span></div>`+(D.d?`<div class="disc"><span>הנחת כמות${D.dp?' ('+D.dp+'%)':''}</span><span>−${nis(D.d)}</span></div>`:'')+`<div class="grand"><span>סה״כ לתשלום</span><span>${nis(D.t)}</span></div>`;
  const ph=String(D.p||'').replace(/[^0-9+]/g,''),intl=ph.startsWith('0')?'972'+ph.slice(1):ph.replace('+','');
  if(ph){$('#tel').href='tel:'+ph;$('#wa').href='https://wa.me/'+intl+'?text='+encodeURIComponent(`שלום ${D.n||''}, כאן VENIA. קיבלנו את ההזמנה שלך (מס׳ ${D.i}). `)}else{$('#tel').hidden=true;$('#wa').hidden=true}
  const txt=()=>`שלום, זה אישור ההזמנה שלי (מס׳ ${D.i}):\n`+D.l.map(x=>`• ${x[0]} | ${x[4]||'שקית ממותגת'} | כמות: ${x[1]} | ${nis(x[2])} ליחידה | ${nis(x[1]*x[2])}\n   ${(x[3]||[]).join('; ')}`).join('\n')+'\n'+(D.d?`הנחת כמות ${D.dp||''}%: −${nis(D.d)}\n`:'')+`סה״כ לתשלום: ${nis(D.t)}\n\nשם: ${D.n||''}\nטלפון: ${D.p||''}\nמייל: ${D.e||''}\nשם העסק לחשבונית: ${D.b||''}\nמשלוח: ${D.dl||''}`+(D.nt?`\nהערות: ${D.nt}`:'');
  $('#cp').onclick=async()=>{const b=$('#cp');try{await navigator.clipboard.writeText(txt());b.textContent='✓ הועתק. עכשיו מדביקים באפליקציה'}catch(e){const ta=document.createElement('textarea');ta.value=txt();document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();b.textContent='✓ הועתק'}setTimeout(()=>b.textContent='העתקה לאפליקציה',3500)};
  const pcs=D.l.reduce((a,x)=>a+(+x[1]||0),0);
  $('#label').innerHTML=`<div class="lh"><div><span class="lw">VENIA</span><small>וֶניה · מארזי הוקרה</small></div><div class="lno">הזמנה מס׳<b>${esc(D.i)}</b></div></div>
    <dl>${D.b?`<dt>עסק</dt><dd>${esc(D.b)}</dd>`:''}${D.n?`<dt>איש קשר</dt><dd>${esc(D.n)}</dd>`:''}${D.p?`<dt>טלפון</dt><dd dir="ltr" style="text-align:right">${esc(D.p)}</dd>`:''}${D.dl?`<dt>משלוח</dt><dd>${esc(D.dl)}</dd>`:''}</dl>
    ${D.l.map(x=>`<div class="lbox"><b>${esc(x[0])} · ${esc(x[1])} יח׳</b><ul>${(x[3]||[]).map(d=>`<li>${esc(d)}</li>`).join('')}</ul></div>`).join('')}
    ${D.nt?`<div class="lbox"><b>הערות</b>${esc(D.nt)}</div>`:''}
    <div class="lq">סה״כ ${pcs} מארזים</div>`;
  $('#prA4').onclick=()=>{document.body.classList.remove('lbl');$('#pg').textContent='@page{size:A4;margin:10mm}';print()};
  $('#prLbl').onclick=()=>{document.body.classList.add('lbl');$('#pg').textContent='@page{size:100mm 150mm;margin:3mm}';print()};
  addEventListener('afterprint',()=>document.body.classList.remove('lbl'));
  $('#page').hidden=false;
})();
</script>
</body>
</html>
